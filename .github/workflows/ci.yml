name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate example screenshots
        working-directory: example
        run: |
          flutter pub get
          dart run store_shots
      - uses: actions/upload-artifact@v4
        with:
          name: example-store-shots
          path: example/build/store_shots
