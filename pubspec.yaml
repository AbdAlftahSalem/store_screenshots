name: store_shots
description: >-
  App Store and Google Play screenshots from your Flutter app inside flutter test:
  device frames, translated captions, RTL, 10 templates, highlights and the Play Feature Graphic.
version: 0.1.0
repository: https://github.com/AbdAlftahSalem/store_shots
issue_tracker: https://github.com/AbdAlftahSalem/store_shots/issues
topics: [screenshots, app-store, google-play, testing, localization]
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  args: ^2.5.0
  yaml: ^3.1.2

dev_dependencies:
  flutter_lints: ^6.0.0

executables:
  store_shots:

flutter:
